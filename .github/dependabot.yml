version: 2
# Monthly + grouped keeps PR noise low; GitHub security updates are separate and still arrive immediately.
updates:
  - package-ecosystem: npm
    directory: /vite-ts
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; @types/node must track the pinned Node 24.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /mv3-extension
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; @types/node must track the pinned Node 24.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /worker-proxy
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; @types/node must track the pinned Node 24.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
