name: CI

# Self-contained on purpose: this repo is public, and a public repo cannot call the shared
# workflow in the private vincentwesley/house repo. Same steps as house's ci-node.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identity check (only vincentwesley and Dependabot commits)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF..HEAD"; else range="HEAD^!"; fi
          bad=$(git log --no-merges --format='%ae' "$range" \
            | grep -v -x -F -e '221810966+vincentwesley@users.noreply.github.com' \
                       -e '49699333+dependabot[bot]@users.noreply.github.com' || true)
          if [ -n "$bad" ]; then echo "Unexpected commit author email(s):"; echo "$bad" | sort -u; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
